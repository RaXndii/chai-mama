name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Playwright 1.56 installs its Chromium on Ubuntu 24.04, not on 26.04 (what ubuntu-latest became).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
